
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Gerencial - Mercado de Energía XM</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.0"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            color: #333;
            padding: 20px;
            margin: 0;
        }
        .contenedor {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Encabezado Principal */
        .header-dashboard {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #009639; /* Verde Corporativo */
            margin-bottom: 20px;
        }
        h2 { color: #005a9c; margin: 0; }
        .controles { display: flex; gap: 12px; align-items: center; }
        
        /* Selectores y Botones */
        select {
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            color: #005a9c;
            border: 2px solid #005a9c;
            border-radius: 5px;
            background-color: white;
            cursor: pointer;
            outline: none;
        }
        button {
            background-color: #009639;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #007a2e; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        #btnResetZoom { background-color: #005a9c; display: none; }
        #btnResetZoom:hover { background-color: #004070; }
        #estadoCarga { font-size: 14px; color: #666; margin-top: 5px; font-style: italic; }

        /* Contenedores de KPIs */
        .kpi-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .kpi-card {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 4px solid #005a9c; /* Azul Corporativo */
            text-align: center;
        }
        .kpi-card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
        }
        .kpi-card .valor {
            font-size: 26px;
            font-weight: bold;
            color: #333;
        }
        .kpi-card .unidad { font-size: 14px; color: #888; font-weight: bold; margin-top: 2px;}

        /* Marco de la Gráfica */
        .grafico-wrapper {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .grafico-container {
            position: relative;
            height: 450px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <div class="header-dashboard">
            <div>
                <h2>Panel de Control Operativo - XM</h2>
                <div id="estadoCarga">Haz clic en "Actualizar Datos" para sincronizar la historia desde 2025.</div>
            </div>
            <div class="controles">
                <select id="selectorMetrica" onchange="alternarVistaMetrica()">
                    <option value="demanda">Demanda Real Regulada</option>
                    <option value="precio">Precio de Bolsa Nacional</option>
                </select>
                <button id="btnResetZoom" onclick="restablecerZoom()">Ver Toda la Historia</button>
                <button id="btnActualizar" onclick="iniciarExtraccionHistorica()">Actualizar Datos</button>
            </div>
        </div>

        <div class="kpi-container">
            <div class="kpi-card">
                <h3>Máximo Histórico</h3>
                <div class="valor" id="kpiMax">--</div>
                <div class="unidad" id="unitMax">-</div>
            </div>
            <div class="kpi-card">
                <h3>Promedio Histórico</h3>
                <div class="valor" id="kpiAvg">--</div>
                <div class="unidad" id="unitAvg">-</div>
            </div>
            <div class="kpi-card">
                <h3>Mínimo Histórico</h3>
                <div class="valor" id="kpiMin">--</div>
                <div class="unidad" id="unitMin">-</div>
            </div>
        </div>

        <div class="grafico-wrapper">
            <div class="grafico-container">
                <canvas id="graficoDemanda"></canvas>
            </div>
        </div>
    </div>

    <script>
        let miGrafico = null;
        
        // Estructuras de almacenamiento global para la historia indexada
        let historialEtiquetas = [];
        let historialDemanda = [];
        let historialPrecio = [];

        // Plugin Línea Vertical de Seguimiento (Crosshair)
        const pluginLineaVertical = {
            id: 'lineaVertical',
            afterDraw: chart => {
                if (chart.tooltip?._active?.length) {
                    let x = chart.tooltip._active[0].element.x;
                    let yAxis = chart.scales.y;
                    let ctx = chart.ctx;
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(x, yAxis.top);
                    ctx.lineTo(x, yAxis.bottom);
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = '#005a9c'; 
                    ctx.setLineDash([5, 5]); 
                    ctx.stroke();
                    ctx.restore();
                }
            }
        };

        async function iniciarExtraccionHistorica() {
            const btn = document.getElementById('btnActualizar');
            const btnZoom = document.getElementById('btnResetZoom');
            const estado = document.getElementById('estadoCarga');
            
            btn.disabled = true;
            btnZoom.style.display = 'none';
            estado.style.color = "#005a9c";

            let fechaInicioCiclo = new Date('2025-01-01');
            const fechaFinGlobal = new Date();
            
            // Reiniciamos los arreglos para evitar duplicidades en actualizaciones limpias
            historialEtiquetas = [];
            historialDemanda = [];
            historialPrecio = [];

            try {
                while (fechaInicioCiclo <= fechaFinGlobal) {
                    let fechaFinCiclo = new Date(fechaInicioCiclo);
                    fechaFinCiclo.setDate(fechaFinCiclo.getDate() + 29);
                    
                    if (fechaFinCiclo > fechaFinGlobal) fechaFinCiclo = fechaFinGlobal;

                    const strInicio = fechaInicioCiclo.toISOString().split('T')[0];
                    const strFin = fechaFinCiclo.toISOString().split('T')[0];

                    estado.innerText = `Sincronizando bloque de mercado: ${strInicio} al ${strFin}...`;

                    // Descarga paralela de ambas métricas para optimizar rendimiento de red
                    const [resDemanda, resPrecio] = await Promise.all([
                        consultarAPI_XM('DemaRealReg', strInicio, strFin),
                        consultarAPI_XM('PrecBolsNaci', strInicio, strFin)
                    ]);

                    procesarBloquesHorarios(resDemanda, resPrecio);

                    fechaInicioCiclo.setDate(fechaInicioCiclo.getDate() + 30);
                }

                estado.innerText = `¡Datos sincronizados! Mostrando ventana analítica de los últimos 7 días.`;
                estado.style.color = "#009639";
                btnZoom.style.display = 'block';

                // Renderizar la vista inicial del dashboard
                alternarVistaMetrica();

            } catch (error) {
                console.error(error);
                estado.innerText = "Error en la comunicación con la API de XM. Revisa la consola corporativa.";
                estado.style.color = "red";
            } finally {
                btn.disabled = false;
            }
        }

        async function consultarAPI_XM(metricId, fechaInicial, fechaFinal) {
            const url = "https://servapibi.xm.com.co/hourly";
            const peticion = {
                "MetricId": metricId,
                "StartDate": fechaInicial,
                "EndDate": fechaFinal,
                "Entity": "Sistema",
                "Filter": []
            };

            const respuesta = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(peticion)
            });

            if (!respuesta.ok) throw new Error(`HTTP Error: ${respuesta.status}`);
            return await respuesta.json();
        }

        // Procesa y alinea las respuestas horarias de ambas variables
        function procesarBloquesHorarios(jsonDemanda, jsonPrecio) {
            if (!jsonDemanda.Items || !jsonPrecio.Items) return;
            
            const itemsD = jsonDemanda.Items;
            const itemsP = jsonPrecio.Items;

            for (let idx = 0; idx < itemsD.length; idx++) {
                const itemD = itemsD[idx];
                const itemP = itemsP[idx];
                if (!itemD || !itemP) continue;

                const fecha = itemD.Date.split('T')[0];
                const horasD = itemD.HourlyEntities?.[0]?.Values;
                const horasP = itemP.HourlyEntities?.[0]?.Values;

                if (horasD && horasP) {
                    for (let i = 1; i <= 24; i++) {
                        let horaStr = String(i).padStart(2, '0');
                        let llaveHora = "Hour" + horaStr;
                        
                        if (horasD[llaveHora] !== undefined && horasP[llaveHora] !== undefined) {
                            historialEtiquetas.push(`${fecha} ${horaStr}:00`);
                            historialDemanda.push(Number(horasD[llaveHora]));
                            historialPrecio.push(Number(horasP[llaveHora]));
                        }
                    }
                }
            }
        }

        // Lee el selector del menú y actualiza la pantalla dinámicamente
        function alternarVistaMetrica() {
            if (historialEtiquetas.length === 0) return;

            const metricaSeleccionada = document.getElementById('selectorMetrica').value;
            
            let datosAMostrar = [];
            let nombreDataset = "";
            let unidadTexto = "";
            let colorLinea = "";
            let colorFondo = "";

            if (metricaSeleccionada === 'demanda') {
                datosAMostrar = historialDemanda;
                nombreDataset = "Demanda Real Regulada";
                unidadTexto = "kWh";
                colorLinea = "#009639"; // Verde
                colorFondo = "rgba(0, 150, 57, 0.1)";
            } else {
                datosAMostrar = historialPrecio;
                nombreDataset = "Precio de Bolsa Nacional";
                unidadTexto = "$/kWh";
                colorLinea = "#005a9c"; // Azul
                colorFondo = "rgba(0, 90, 156, 0.1)";
            }

            // 1. Recalcular e Inyectar KPIs para la variable activa
            actualizarTarjetasKPI(datosAMostrar, unidadTexto);

            // 2. Dibujar o refrescar el gráfico con la nueva variable
            renderizarGraficoEstructurado(nombreDataset, datosAMostrar, unidadTexto, colorLinea, colorFondo);
        }

        function actualizarTarjetasKPI(valores, unidad) {
            const maxVal = valores.reduce((a, b) => Math.max(a, b), -Infinity);
            const minVal = valores.reduce((a, b) => Math.min(a, b), Infinity);
            const sumVal = valores.reduce((a, b) => a + b, 0);
            const avgVal = sumVal / valores.length;

            // Formateo numérico descriptivo de miles y decimales
            document.getElementById('kpiMax').innerText = maxVal.toLocaleString('es-CO', {maximumFractionDigits: 2});
            document.getElementById('kpiMin').innerText = minVal.toLocaleString('es-CO', {maximumFractionDigits: 2});
            document.getElementById('kpiAvg').innerText = avgVal.toLocaleString('es-CO', {maximumFractionDigits: 2});

            // Actualizar etiquetas de unidad corporativa
            document.getElementById('unitMax').innerText = unidad;
            document.getElementById('unitMin').innerText = unidad;
            document.getElementById('unitAvg').innerText = unidad;
        }

        function renderizarGraficoEstructurado(labelDataset, datos, unidad, colorLinea, colorFondo) {
            const ctx = document.getElementById('graficoDemanda').getContext('2d');

            if (miGrafico) miGrafico.destroy();

            // Cálculo matemático para forzar la ventana inicial a las últimas 168 horas (7 días)
            const totalPuntos = historialEtiquetas.length;
            const puntos7Dias = 7 * 24;
            const indexMin = totalPuntos > puntos7Dias ? totalPuntos - puntos7Dias : 0;
            const etiquetaMinima = historialEtiquetas[indexMin];
            const etiquetaMaxima = historialEtiquetas[totalPuntos - 1];

            miGrafico = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: historialEtiquetas,
                    datasets: [{
                        label: labelDataset,
                        data: datos,
                        borderColor: colorLinea, 
                        backgroundColor: colorFondo,
                        borderWidth: 1.5,
                        pointRadius: 0, 
                        pointHoverRadius: 6, 
                        pointHoverBackgroundColor: '#005a9c', 
                        pointHoverBorderColor: 'white',
                        pointHoverBorderWidth: 2,
                        fill: true,
                        tension: 0.1
                    }]
                },
                plugins: [pluginLineaVertical],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false, 
                    },
                    plugins: {
                        tooltip: {
                            backgroundColor: 'rgba(255, 255, 255, 0.95)',
                            titleColor: '#004070',
                            bodyColor: '#333',
                            borderColor: '#ccc',
                            borderWidth: 1,
                            callbacks: {
                                label: function(context) {
                                    return ' ' + context.parsed.y.toLocaleString('es-CO', {maximumFractionDigits: 2}) + ' ' + unidad;
                                }
                            }
                        },
                        zoom: {
                            zoom: {
                                wheel: { enabled: true },
                                drag: { 
                                    enabled: true, 
                                    backgroundColor: 'rgba(0, 90, 156, 0.2)' 
                                },
                                mode: 'x', 
                            },
                            pan: { enabled: true, mode: 'x' }
                        }
                    },
                    scales: {
                        x: {
                            min: etiquetaMinima,
                            max: etiquetaMaxima,
                            ticks: { maxTicksLimit: 12 }
                        },
                        y: {
                            beginAtZero: false,
                            title: { display: true, text: unidad }
                        }
                    }
                }
            });
        }

        function restablecerZoom() {
            if (miGrafico) {
                delete miGrafico.options.scales.x.min;
                delete miGrafico.options.scales.x.max;
                miGrafico.resetZoom();
                miGrafico.update();
                document.getElementById('estadoCarga').innerText = "Visualizando serie histórica completa desde el 1 de enero de 2025.";
            }
        }
    </script>
</body>
</html>
